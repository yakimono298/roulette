<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ポイントルーレット</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px 15px;
      background: #f7f7f7;
      margin: 0;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 25px;
    }

    /* =========================
       ルーレット全体
       ========================= */

    #rouletteWrap {
      position: relative;
      width: 360px;
      height: 360px;
      margin: 0 auto 25px;
    }

    /* =========================
       ルーレット本体
       ========================= */

    #roulette {
      width: 360px;
      height: 360px;

      border-radius: 50%;
      border: 8px solid #333;

      position: relative;

      /*
       * 40マスを作る
       * JavaScriptで背景を設定
       */

      transition:
        transform 5s cubic-bezier(0.12, 0.8, 0.18, 1);

      overflow: hidden;
    }

    /* =========================
       各マスの文字
       ========================= */

    .label {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 50%;
      height: 50%;

      transform-origin: 0% 0%;

      pointer-events: none;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 12px;
      font-weight: bold;

      z-index: 2;
    }

    .label span {
      display: block;

      /*
       * 文字をマスの中央付近に配置
       */
      transform:
        translate(25%, 25%)
        rotate(4.5deg);

      white-space: nowrap;
    }

    /* =========================
       上の矢印
       ========================= */

    #pointer {
      position: absolute;

      z-index: 20;

      top: -18px;
      left: 50%;

      transform: translateX(-50%);

      width: 0;
      height: 0;

      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 40px solid #e53935;

      filter:
        drop-shadow(0 2px 2px rgba(0,0,0,0.3));
    }

    /* =========================
       中央
       ========================= */

    #center {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      width: 70px;
      height: 70px;

      background: white;

      border: 5px solid #333;
      border-radius: 50%;

      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;
      font-weight: bold;
    }

    /* =========================
       ボタン
       ========================= */

    #startBtn {
      font-size: 22px;
      font-weight: bold;

      padding: 14px 45px;

      border: none;
      border-radius: 12px;

      background: #ff9800;
      color: white;

      cursor: pointer;

      box-shadow: 0 4px 0 #d17c00;

      transition: 0.15s;
    }

    #startBtn:hover {
      background: #ffa726;
    }

    #startBtn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #d17c00;
    }

    #startBtn:disabled {
      background: #aaa;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* =========================
       結果
       ========================= */

    #result {
      margin-top: 30px;

      min-height: 70px;

      font-size: 36px;
      font-weight: bold;

      color: #333;
    }

    /* 結果の色 */

    .result-0 {
      color: #000;
    }

    .result-1 {
      color: #29b6f6;
    }

    .result-2 {
      color: #43a047;
    }

    .result-3 {
      color: #fbc02d;
    }

    .result-5 {
      color: #fb8c00;
    }

    .result-10 {
      color: #e53935;
    }

    .result-20 {
      color: #8e24aa;
    }

    .result-30 {
      color: #d4a017;
    }

    /* =========================
       小さい画面
       ========================= */

    @media (max-width: 430px) {

      #rouletteWrap {
        width: 300px;
        height: 300px;
      }

      #roulette {
        width: 300px;
        height: 300px;
      }

      .label {
        font-size: 9px;
      }

      #result {
        font-size: 30px;
      }
    }

  </style>
</head>


<body>

  <h1>🎯 ポイントルーレット 🎯</h1>


  <div id="rouletteWrap">

    <!-- 矢印 -->
    <div id="pointer"></div>

    <!-- ルーレット -->
    <div id="roulette"></div>

    <!-- 中央 -->
    <div id="center">
      GO!
    </div>

  </div>


  <button id="startBtn">
    ルーレットを回す！
  </button>


  <div id="result"></div>


  <script>

    /*
     * =====================================================
     * ポイント設定
     * =====================================================
     *
     * point = ポイント
     * count = そのポイントのマス数
     * color = そのポイントの色
     *
     * 合計40マス
     */

    const pointSettings = [
      {
        point: 0,
        count: 5,
        color: "#000000"
      },

      {
        point: 1,
        count: 9,
        color: "#29b6f6"
      },

      {
        point: 2,
        count: 8,
        color: "#43a047"
      },

      {
        point: 3,
        count: 6,
        color: "#fbc02d"
      },

      {
        point: 5,
        count: 5,
        color: "#fb8c00"
      },

      {
        point: 10,
        count: 4,
        color: "#e53935"
      },

      {
        point: 20,
        count: 2,
        color: "#8e24aa"
      },

      {
        point: 30,
        count: 1,
        color: "#d4a017"
      }
    ];


    /*
     * =====================================================
     * 40マスを作る
     * =====================================================
     *
     * ここで
     *
     * 「この色のマス = このポイント」
     *
     * という関係を作っています。
     */

    const slots = [];


    pointSettings.forEach(setting => {

      for (let i = 0; i < setting.count; i++) {

        slots.push({
          point: setting.point,
          color: setting.color
        });

      }

    });


    /*
     * 念のため40マスかチェック
     */

    console.log("マス数:", slots.length);


    /*
     * =====================================================
     * ルーレットを作る
     * =====================================================
     */

    const roulette =
      document.getElementById("roulette");


    const total =
      slots.length;


    /*
     * 1マスの角度
     *
     * 360 ÷ 40 = 9度
     */

    const angle =
      360 / total;


    /*
     * =====================================================
     * conic-gradientで40マスを描く
     * =====================================================
     *
     * 各マスの色をそのまま使います。
     *
     * これによって、
     *
     * 「表示されている色」
     *
     * と
     *
     * 「slotsのポイント」
     *
     * が完全に同じ順番になります。
     */

    let gradientParts = [];


    slots.forEach((slot, index) => {

      const start =
        index * angle;

      const end =
        (index + 1) * angle;


      gradientParts.push(
        `${slot.color} ${start}deg ${end}deg`
      );

    });


    roulette.style.background =
      `conic-gradient(from -90deg, ${gradientParts.join(",")})`;


    /*
     * =====================================================
     * マスの境界線
     * =====================================================
     */

    slots.forEach((slot, index) => {

      const label =
        document.createElement("div");

      label.className = "label";


      /*
       * マスの位置
       */

      label.style.transform =
        `rotate(${index * angle}deg) skewY(${90 - angle}deg)`;


      /*
       * 文字
       */

      const span =
        document.createElement("span");


      span.textContent =
        slot.point + "pt";


      /*
       * 黒・濃い色の背景では白文字
       * 黄色では黒文字
       */

      if (
        slot.point === 3 ||
        slot.point === 2 ||
        slot.point === 1 ||
        slot.point === 5
      ) {
        span.style.color = "#222";
      } else {
        span.style.color = "#fff";
      }


      label.appendChild(span);

      roulette.appendChild(label);

    });


    /*
     * =====================================================
     * ボタン・結果
     * =====================================================
     */

    const startBtn =
      document.getElementById("startBtn");


    const result =
      document.getElementById("result");


    /*
     * 現在のルーレット回転角度
     */

    let currentRotation = 0;


    /*
     * =====================================================
     * ルーレットを回す
     * =====================================================
     */

    startBtn.addEventListener("click", () => {

      /*
       * ボタンを押せなくする
       */

      startBtn.disabled = true;


      /*
       * 結果を消す
       */

      result.textContent = "";
      result.className = "";


      /*
       * =================================================
       * 今回止めたいマスをランダムに決める
       * =================================================
       */

      const selectedIndex =
        Math.floor(Math.random() * total);


      /*
       * =================================================
       * 選んだマスの中央角度
       * =================================================
       */

      const targetAngle =
        selectedIndex * angle + angle / 2;


      /*
       * =================================================
       * 6回転させる
       * =================================================
       */

      const extraRotation =
        360 * 6;


      /*
       * =================================================
       * 矢印は上（-90度）にあるので、
       * 選んだマスの中央が上に来るように回す。
       * =================================================
       */

      currentRotation +=
        extraRotation +
        (360 - targetAngle);


      /*
       * 回転
       */

      roulette.style.transform =
        `rotate(${currentRotation}deg)`;


      /*
       * =================================================
       * 回転終了
       * =================================================
       */

      setTimeout(() => {

        /*
         * =================================================
         * ここが重要
         * =================================================
         *
         * 実際に矢印が指しているマスのデータを
         * slotsから取得します。
         *
         * そのため、
         *
         * 「矢印の色」
         *
         * と
         *
         * 「結果のポイント」
         *
         * が必ず同じになります。
         */

        const selectedSlot =
          slots[selectedIndex];


        const selectedPoint =
          selectedSlot.point;


        const selectedColor =
          selectedSlot.color;


        console.log(
          "選択されたマス:",
          selectedIndex
        );

        console.log(
          "色:",
          selectedColor
        );

        console.log(
          "ポイント:",
          selectedPoint
        );


        /*
         * =================================================
         * 結果表示
         * =================================================
         */

        result.className =
          "result-" + selectedPoint;


        result.textContent =
          `🎉 ${selectedPoint} pt！ 🎉`;


        /*
         * ボタンを再び押せるようにする
         */

        startBtn.disabled = false;


      }, 5000);

    });

  </script>

</body>
</html>
